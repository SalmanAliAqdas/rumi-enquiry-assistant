name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rumi_test
          POSTGRES_PASSWORD: fictional-ci-only
          POSTGRES_DB: rumi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rumi_test -d rumi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://rumi_test:fictional-ci-only@127.0.0.1:5432/rumi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e ".[dev]"
      - run: python -m pip check
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
