[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[project]
name = "rumi-enquiry-assistant"
version = "0.3.0"
description = "A local enquiry workflow with optional Gemini processing and manual review"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlmodel>=0.0.24,<0.1",
  "pydantic-settings>=2.8,<3", "email-validator>=2.2,<3", "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.20,<1", "pwdlib[argon2]>=0.2,<1",
  "google-genai>=2.33,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2.16,<3", "ruff>=0.11,<1"]
browser = ["playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
